
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Design Tokens</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>CSS Design Tokens</h1>
        <p>A simple demonstration of reusable CSS variables</p>
    </header>

    <main>

        <section class="card">
            <h2>Color Tokens</h2>
            <div class="color-boxes">
                <div class="color primary">Primary</div>
                <div class="color secondary">Secondary</div>
                <div class="color accent">Accent</div>
            </div>
        </section>

        <section class="card">
            <h2>Typography Tokens</h2>
            <h1 class="heading">Heading Example</h1>
            <p class="text">This is an example of body text using CSS design tokens.</p>
        </section>

        <section class="card">
            <h2>Spacing and Border Tokens</h2>
            <div class="spacing-box">Spacing Example</div>
            <button>Sample Button</button>
        </section>

    </main>

    <footer>
        <p>Created for P7 - CSS Design Tokens</p>
    </footer>

</body>
</html>
