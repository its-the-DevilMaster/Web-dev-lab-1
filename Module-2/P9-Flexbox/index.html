
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CSS Flexbox Demonstration</h1>
        <p>Learning flexible layouts with CSS</p>
    </header>

    <main>
        <section>
            <h2>1. Flex Direction</h2>
            <div class="container direction">
                <div class="box">Box 1</div>
                <div class="box">Box 2</div>
                <div class="box">Box 3</div>
            </div>
        </section>

        <section>
            <h2>2. Justify Content</h2>
            <div class="container justify">
                <div class="box">Box 1</div>
                <div class="box">Box 2</div>
                <div class="box">Box 3</div>
            </div>
        </section>

        <section>
            <h2>3. Align Items</h2>
            <div class="container align">
                <div class="box">Box 1</div>
                <div class="box tall">Box 2</div>
                <div class="box">Box 3</div>
            </div>
        </section>

        <section>
            <h2>4. Flex Wrap</h2>
            <div class="container wrap">
                <div class="box">Box 1</div>
                <div class="box">Box 2</div>
                <div class="box">Box 3</div>
                <div class="box">Box 4</div>
                <div class="box">Box 5</div>
            </div>
        </section>

        <section>
            <h2>5. Flex Grow</h2>
            <div class="container grow">
                <div class="box">Grow 1</div>
                <div class="box">Grow 2</div>
                <div class="box">Grow 3</div>
            </div>
        </section>
    </main>

    <footer>
        <p>Created for P9 - CSS Flexbox</p>
    </footer>

</body>
</html>
